name: Snapshot Deployment

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Set build number
        run: |
          base=$(grep '^buildNumber=' buildNumber.properties | cut -d= -f2)
          echo "buildNumber=$(( base + ${{ github.run_number }} - 1 ))" > buildNumber.properties

      - name: Build with Maven
        run: mvn -B package

      - name: Upload JAR plugin
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: |
            target/mcc-*.jar
            !target/original-*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: snapshot-deploy
      cancel-in-progress: false
    steps:
      - name: Download JAR plugin
        uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: dist

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts

      - name: Upload to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "
            rm -f ~/asp-dev/plugins/mcc-*.jar
          "
          scp dist/mcc-*.jar "$VPS_USER@$VPS_HOST:~/asp-dev/plugins/"
          ssh "$VPS_USER@$VPS_HOST" '
            screen -S pasp-dev -p 0 -X stuff "restart\r"
            for i in $(seq 120); do pgrep -f "^java .*asp\.jar" > /dev/null || break; sleep 1; done
            screen -S pasp-dev -p 0 -X stuff "java -Xms2G -Xmx5G -jar ./asp.jar -nogui\r"
          '
